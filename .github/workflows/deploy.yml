name: CI/CD Pipeline & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 1.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 1.3 Sprawdzenie poprawności syntaktycznej JavaScript
        run: npm run check:syntax

      - name: 1.4 Uruchomienie testów jednostkowych i raportu pokrycia (Coverage)
        run: npm run test:coverage

  build-and-audit:
    name: 2. Budowa PDF & Audyt Lighthouse CI
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 2.3 Przygotowanie katalogu dist
        run: |
          mkdir -p dist
          cp .htaccess index.html robots.txt sitemap.xml site.webmanifest llms.txt dist/
          cp -r .well-known dist/
          cp -r assets dist/

      - name: 2.4 Generowanie oficjalnego pliku PDF
        run: npm run build:pdf

      - name: 2.5 Zapisanie pliku PDF jako artefakt wydania (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Pawel_Krzewinski_CV-PDF
          path: dist/Pawel_Krzewinski_CV.pdf
          retention-days: 30

      - name: 2.6 Audyt jakościowy Lighthouse CI (a11y, SEO, Best Practices)
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'

  deploy:
    name: 3. Wdrożenie na serwer produkcyjny (LH)
    needs: [build-and-audit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 3.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 3.3 Przygotowanie paczki produkcyjnej (HTML + SEO + PWA + Assets + PDF)
        run: |
          mkdir -p dist
          cp .htaccess index.html robots.txt sitemap.xml site.webmanifest llms.txt dist/
          cp -r .well-known dist/
          cp -r assets dist/
          npm run build:pdf

      - name: 3.4 Weryfikacja ścieżki docelowej SFTP (Fail-Closed Production Guard)
        env:
          TARGET_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_PATH:-}" ]; then
            echo "::error::Sekret SFTP_REMOTE_PATH jest pusty! Wdrożenie zatrzymane (Fail-Closed)."
            exit 1
          fi
          if printf '%s' "$TARGET_PATH" | grep -qiE '(krzysztofpoczatek\.pl|\.\.|^/$)'; then
            echo "::error::Wykryto zablokowaną lub niebezpieczną ścieżkę w SFTP_REMOTE_PATH! Wdrożenie zatrzymane."
            exit 1
          fi
          case "$TARGET_PATH" in
            /home/*) ;;
            *)
              echo "::error::SFTP_REMOTE_PATH musi wskazywać bezpieczny katalog na serwerze (/home/...)."
              exit 1
              ;;
          esac
          echo "✅ Zweryfikowano docelową ścieżkę wdrożenia SFTP."

      - name: 3.5 Bezpieczny transfer SFTP/SSH na serwer hostingowy LH (wraz z .htaccess i .well-known)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Sekret SSH_PRIVATE_KEY jest pusty! Wdrożenie zatrzymane."
            exit 1
          fi
          install -m 600 /dev/null /tmp/lh_deploy_key
          trap 'rm -f /tmp/lh_deploy_key' EXIT INT TERM
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/lh_deploy_key
          rsync -avz --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            -e "ssh -i /tmp/lh_deploy_key -p ${SFTP_PORT:-40022} -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30" \
            ./dist/ "${SFTP_USER}@${SFTP_SERVER}:${remote_path}/"

      - name: 3.6 Czyszczenie cache Cloudflare CDN (opcjonalnie)
        if: env.CF_ZONE != '' && env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "Purging Cloudflare edge cache..."
          curl -fsS --proto '=https' --max-time 20 -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
